name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build EzForensics.sln -c Release
      - name: Core tests
        run: dotnet test tests/EzForensics.Core.Tests -c Release --no-build --filter "Category!=Flaky"
      - name: App tests
        run: dotnet test tests/EzForensics.App.Tests -c Release --no-build --filter "Category!=Flaky"
